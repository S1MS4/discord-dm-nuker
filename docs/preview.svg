<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc">
  <title id="title">Discord DM Nuker interface illustration</title>
  <desc id="desc">A dark compact panel showing 128 deleted messages, sample conversations Alice and Bob, and queue, pause, stop, and nuke buttons.</desc>
  <rect width="480" height="430" rx="24" fill="#15161c"/>
  <rect x="40" y="24" width="400" height="380" rx="14" fill="#202127" stroke="#41434f"/>
  <g font-family="system-ui,Segoe UI,sans-serif">
    <text x="60" y="77" font-size="38" font-weight="650" fill="#f2f3f5">128</text>
    <text x="142" y="76" font-size="14" fill="#aeb1bd">deleted</text>
    <rect x="355" y="40" width="30" height="30" rx="6" fill="#30323b"/>
    <rect x="390" y="40" width="30" height="30" rx="6" fill="#30323b"/>
    <text x="362" y="62" font-size="23" fill="#eee">−</text>
    <text x="397" y="61" font-size="23" fill="#eee">×</text>
    <rect x="60" y="96" width="360" height="38" rx="6" fill="#30323b" stroke="#454753"/>
    <text x="72" y="121" font-size="14" fill="#999da9">Find a person</text>
    <rect x="60" y="147" width="360" height="54" rx="6" fill="#2c2e37"/>
    <rect x="72" y="165" width="16" height="16" rx="3" fill="#5865f2"/>
    <path d="m76 173 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="122" cy="174" r="19" fill="#7d5bd6"/>
    <text x="115" y="180" font-size="17" fill="#fff">A</text>
    <text x="152" y="180" font-size="16" fill="#eee">Alice</text>
    <rect x="72" y="223" width="16" height="16" rx="3" fill="#5865f2"/>
    <path d="m76 231 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="122" cy="232" r="19" fill="#337b86"/>
    <text x="116" y="238" font-size="17" fill="#fff">B</text>
    <text x="152" y="238" font-size="16" fill="#eee">Bob</text>
    <rect x="60" y="264" width="360" height="32" rx="6" fill="#30323b" stroke="#454753"/>
    <text x="216" y="285" font-size="13" fill="#eee">Expand</text>
    <rect x="60" y="310" width="172" height="34" rx="6" fill="#a72b3b"/>
    <text x="73" y="332" font-size="14" fill="#fff">Delete selected DMs</text>
    <rect x="240" y="310" width="75" height="34" rx="6" fill="#f0b232"/>
    <text x="255" y="332" font-size="14" font-weight="650" fill="#171717">Pause</text>
    <rect x="323" y="310" width="65" height="34" rx="6" fill="#30323b" stroke="#454753"/>
    <text x="339" y="332" font-size="14" fill="#eee">Stop</text>
    <rect x="60" y="354" width="360" height="34" rx="6" fill="#30323b" stroke="#ef6177"/>
    <text x="185" y="376" font-size="14" font-weight="700" fill="#ef8999">NUKE all DMs</text>
  </g>
</svg>
